services:
  mysql:
    image: mysql:8.4
    container_name: agent2-autopost-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autopost
      MYSQL_USER: autopost
      MYSQL_PASSWORD: autopost
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
